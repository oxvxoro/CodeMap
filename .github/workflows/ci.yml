name: CI

on:
  push:
    branches: [main, master, CodeMap]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CodeMap.slnx

      - name: Build
        run: dotnet build CodeMap.slnx --no-restore -warnaserror

      - name: Test
        run: dotnet test CodeMap.slnx --no-build --logger "trx;LogFileName=codemap.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/*.trx
